<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bhimlekha</title>
    <meta name="description" content="Bhimlekha — Bhima's record. A personal workout logger that saves to a Google Sheet." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bhimlekha" />
    <meta name="theme-color" content="#17120F" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" class="app" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="modal" class="modal" hidden></div>
    <div id="camera" class="camera" hidden></div>
    <div id="pickers">
      <input id="photo-file" type="file" accept="image/*" capture="user" class="sr-only" data-change="photoFile" aria-label="Photo" tabindex="-1" />
      <input id="vault-restore" type="file" class="sr-only" data-change="vaultRestoreFile" aria-label="Backup file" tabindex="-1" />
    </div>
    <script src="./progress.js"></script>
    <script src="./body.js"></script>
    <script src="./muscles.js"></script>
    <script src="./charts.js"></script>
    <script src="./vault.js"></script>
    <script src="./track.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
